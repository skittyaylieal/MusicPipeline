<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Music Pipeline Master Console</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0F0F11; color: #E2E8F0; margin: 0; padding: 25px; }
        .alert-container { margin-bottom: 20px; }
        .alert { padding: 15px 20px; border-radius: 6px; margin-bottom: 10px; font-size: 0.95em; display: flex; justify-content: space-between; align-items: center; font-weight: 500; }
        .alert-danger { background: #4C1D1D; color: #F87171; border: 1px solid #7F1D1D; }
        .alert-warning { background: #453015; color: #FBBF24; border: 1px solid #78350F; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 25px; }
        .card { background: #18181C; padding: 20px; border-radius: 10px; border: 1px solid #27272A; text-align: center; position: relative; }
        .card h3 { margin: 0; color: #A1A1AA; font-size: 0.9em; text-transform: uppercase; letter-spacing: 0.5px; }
        .card .value { font-size: 2em; font-weight: bold; margin: 10px 0; color: #00ADB5; }
        
        /* Layout Grid for Panels - Enforces column containment */
        .main-layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 25px; margin-bottom: 25px; }
        .bottom-layout { display: grid; grid-template-columns: 1fr; gap: 25px; }
        
        /* Panels - Prevents horizontal blowout */
        .panel { background: #18181C; border-radius: 10px; border: 1px solid #27272A; padding: 20px; display: flex; flex-direction: column; height: 380px; min-width: 0; overflow: hidden; }
        .panel-extended { height: 450px; }
        
        h2 { margin-top: 0; color: #FFF; font-size: 1.3em; border-bottom: 1px solid #27272A; padding-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .control-group { display: flex; gap: 10px; }
        
        .btn { background: #00ADB5; color: #FFF; border: none; padding: 10px 20px; border-radius: 5px; font-weight: bold; cursor: pointer; transition: opacity 0.2s; }
        .btn-warn { background: #D97706; }
        .btn-danger { background: #B91C1C; }
        .btn:hover { opacity: 0.9; }
        .btn:disabled { background: #3F3F46; cursor: not-allowed; opacity: 0.6; }
        
        /* Console Terminal Viewport Updates */
        .console { background: #09090B; border-radius: 6px; padding: 15px; font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace; font-size: 1.05em; line-height: 1.45; color: #39FF14; overflow-y: auto; flex-grow: 1; white-space: pre-wrap; word-break: break-all; border: 1px solid #18181B; }
        .search-box { background: #222226; border: 1px solid #3F3F46; color: #FFF; padding: 10px; border-radius: 5px; width: calc(100% - 22px); margin-bottom: 15px; font-size: 0.95em; }
        .table-wrapper { overflow-y: auto; flex-grow: 1; }
        
        table { width: 100%; border-collapse: collapse; font-size: 0.9em; text-align: left; }
        th { background: #222226; color: #A1A1AA; padding: 10px; font-weight: 600; position: sticky; top: 0; z-index: 10; }
        td { padding: 10px; border-bottom: 1px solid #27272A; }
        
        /* Badges & Telemetry Indicators */
        .badge { padding: 3px 8px; border-radius: 4px; font-size: 0.75em; font-weight: bold; display: inline-block; }
        .badge-lrc { background: #1C3D27; color: #4ADE80; }
        .badge-missing { background: #4C1D1D; color: #F87171; }
        
        .badge-manual { background: #047857; color: #34D399; }
        .badge-auto { background: #1D4ED8; color: #93C5FD; }
        .badge-sweep { background: #78350F; color: #FBBF24; border: 1px solid #D97706; }
        
        /* Highlight rule for tracking sweep divergence */
        .row-clean-sweep { background: rgba(217, 119, 6, 0.04); border-left: 3px solid #D97706; }
        .row-clean-sweep td { color: #FDE047; }
        
        .spinner { border: 3px solid #27272A; border-top: 3px solid #00ADB5; border-radius: 50%; width: 16px; height: 16px; animation: spin 1s linear infinite; display: inline-block; vertical-align: middle; margin-left: 10px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .scan-status { font-size: 0.85em; color: #A1A1AA; font-weight: normal; }
    </style>
</head>
<body>

    <div class="alert-container" id="alerts-zone"></div>

    <div class="grid">
        <div class="card"><h3>Master Tracks</h3><div class="value" id="stat-master-count">-</div></div>
        <div class="card"><h3>Mobile Storage</h3><div class="value" id="stat-mobile-count">-</div></div>
        <div class="card"><h3>Lyrics Index</h3><div class="value" id="stat-lrc-count">-</div></div>
        <div class="card"><h3>Storage Weights</h3><div class="value" id="stat-sizes">-</div></div>
    </div>

    <div class="main-layout">
        <div class="panel">
            <h2>
                Execution Pipeline Terminal
                <div class="control-group">
                    <button class="btn" id="run-btn" onclick="triggerPipeline(false)">Run Master Sync</button>
                    <button class="btn btn-danger" id="sweep-btn" onclick="triggerPipeline(true)">🔥 Clean Sweep</button>
                </div>
            </h2>
            <div class="console" id="terminal-feed">Ready. Awaiting run commands...</div>
        </div>

        <div class="panel">
            <h2>📈 Pipeline Performance
